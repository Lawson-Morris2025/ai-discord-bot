<!-- dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Customization Dashboard</title>
</head>
<body style="background:#0d1117; color:#c9d1d9; font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">
  <div style="background:#161b22; padding:30px; border-radius:12px; width:380px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
    <h2 style="margin-top:0;">Customize Bot Identity</h2>
    <form action="/update" method="POST">
      <label style="font-size:14px;">Custom Name:</label><br>
      <input type="text" id="custom_name" name="custom_name" style="width:100%; padding:8px; margin-top:5px; margin-bottom:15px; background:#0d1117; border:1px solid #30363d; color:#fff; border-radius:6px; box-sizing:border-box;"><br>
      
      <label style="font-size:14px;">Logo Image URL:</label><br>
      <input type="text" id="logo_url" name="logo_url" style="width:100%; padding:8px; margin-top:5px; margin-bottom:15px; background:#0d1117; border:1px solid #30363d; color:#fff; border-radius:6px; box-sizing:border-box;"><br>
      
      <label style="font-size:14px;">Personality / Vibe:</label><br>
      <textarea id="personality" name="personality" rows="3" style="width:100%; padding:8px; margin-top:5px; margin-bottom:15px; background:#0d1117; border:1px solid #30363d; color:#fff; border-radius:6px; box-sizing:border-box; resize:vertical;"></textarea><br>

      <label style="font-size:14px;">AI Engine Choice:</label><br>
      <select id="active_ai" name="active_ai" style="width:100%; padding:8px; margin-top:5px; margin-bottom:20px; background:#0d1117; border:1px solid #30363d; color:#fff; border-radius:6px; box-sizing:border-box;">
        <option value="groq">Groq (Llama 3.3 - Ultra Fast)</option>
        <option value="openai">ChatGPT (GPT-4o-mini)</option>
        <option value="gemini">Gemini Flash</option>
      </select><br>

      <button type="submit" style="width:100%; padding:10px; background:#238636; border:none; color:#fff; font-weight:bold; border-radius:6px; cursor:pointer;">Save Customizations</button>
    </form>
  </div>
</body>
</html>
